name: agentpod-live
version: "0.1.0"
description: "Streams a Matrix turn to the reader's devices as AgentPod live events (answer, reasoning, tool calls), the same events the hub sends for bridge-mode stations."
author: AgentPod
requires_env:
  - MATRIX_HOMESERVER
  - MATRIX_ACCESS_TOKEN
hooks:
  - pre_llm_call
  - post_llm_call
  - on_stream_delta
  - pre_tool_call
  - post_tool_call
