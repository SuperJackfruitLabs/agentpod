# The hub on the staging plane (workbench), checked out at /opt/suite-staging/agentpod.
# It signs in against staging-accounts and reaches nothing real: every provisioner and bridge is
# off, the database starts empty, and no production secret is reused. The shared edge
# (cloudflared on the external `suite-staging` network) routes staging-hub.agentpod.dev here.
name: staging-agentpod

services:
  hub-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
    env_file: ../../../env/hub/postgres.env
    volumes:
      - hubdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      retries: 20

  hub:
    image: oven/bun:1.4.2
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - bunx pnpm@10.18.2 install --frozen-lockfile --filter '@agentpod/hub...' && cd apps/hub && exec bun run src/index.ts
    environment:
      NODE_ENV: production
      PORT: "3001"
      MANAGEMENT_API_PUBLIC_URL: https://staging-hub.agentpod.dev
      ALLOWED_ORIGINS: https://staging-console.agentpod.dev,https://staging-app.superpipeline.dev,https://staging-app.superlibrary.dev
      ORG_PLANE_ISSUER: https://staging-accounts.superjackfruit.com
      ORG_PLANE_URL: https://staging-accounts.superjackfruit.com
      ORG_PLANE_JWKS_URL: https://staging-accounts.superjackfruit.com/api/auth/jwks
      ORG_PLANE_AUDIENCE: https://staging-hub.agentpod.dev
      ORG_PLANE_SERVICE_CREDENTIAL_FILE: /run/secrets/org-plane-credential
      # No provisioning and no Matrix. The Superpipeline bridge is on, against staging Superpipeline
      # only: it claims cards for the staging workspace's rostered agents (fleet bridge add).
      # SUPERPIPELINE_PUSH_SECRET is in env/hub/hub.env, generated on the box.
      ENABLE_DOCKER_PROVISIONING: "false"
      ENABLE_MODAL_PROVISIONING: "false"
      ENABLE_FLY_PROVISIONING: "false"
      ENABLE_CLOUDFLARE_SANDBOXES: "false"
      ENABLE_MATRIX_BRIDGE: "false"
      ENABLE_SUPERPIPELINE_BRIDGE: "true"
      SUPERPIPELINE_BASE_URL: https://staging-app.superpipeline.dev
      SUPERPIPELINE_BOARD_URL: https://staging-app.superpipeline.dev
      # Strict Salaam work publishes verified deliverables to staging SuperLibrary and links them
      # from the card; the work record links items on this host.
      SUPERLIBRARY_URL: https://staging-app.superlibrary.dev
    env_file: ../../../env/hub/hub.env
    volumes:
      - ../..:/app
      - ../../../env/hub/org-plane-credential:/run/secrets/org-plane-credential:ro
    ports:
      - "127.0.0.1:3101:3001"
    networks: [default, suite-staging]
    depends_on:
      hub-postgres:
        condition: service_healthy

  # The console is a static SPA; deploy.sh builds it per commit into
  # /opt/suite-staging/agentpod-console/<sha> with the staging hub baked in, and points `current`
  # at it. Caddy serves `current`, falling back to index.html for client-side routes.
  console:
    image: caddy:2.10-alpine
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/suite-staging/agentpod-console:/srv:ro
    networks: [suite-staging]

networks:
  suite-staging:
    external: true

volumes:
  hubdata:
