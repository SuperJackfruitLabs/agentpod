# AgentPod — nginx vhost for the hosted hub.
#
# Install:  /etc/nginx/sites-available/agentpod-hub  (symlink into sites-enabled)
# Deploy:   see deploy/README-deploy.md  (P3 Task 10)
#
# ADDITIVE ONLY. This file adds one NEW server block (hub.agentpod.dev). It MUST
# NOT modify the existing id.agentpod.dev (Synapse) vhost. Always `nginx -t`
# before reload. The console is on Cloudflare Pages; the app.agentpod.dev block
# that served it from this box was removed on 2026-09-17.
#
# This block listens on :80; run certbot afterwards to add the :443 TLS
# listener and the 80→443 redirect:
#   certbot --nginx -d hub.agentpod.dev
# certbot copies the location blocks into the generated :443 server, so the
# proxy + WS config below applies to HTTPS too.

# ── Hub API + gateway/terminal WebSockets ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hub.agentpod.dev;

    # Generous body size for fs.write of large files.
    client_max_body_size 64m;

    # Everything goes to the hub, including the Matrix push gateway at
    # /_matrix/push/v1/notify (tuwunel's pusher `data.url` is
    # https://hub.agentpod.dev/_matrix/push/v1/notify). No location of its own:
    # the hub caps that body at 64 KiB itself and answers 404 until APNS_* is set.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for the node gateway
        # (/public/nodes/gateway) AND the console terminal
        # (/api/stations/:id/terminal).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived streams (gateway WS, terminal, SSE log tail): don't time
        # out idle-but-open connections quickly.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}

# NOTE: the $connection_upgrade map must exist once in the http{} context.
# Debian/Ubuntu's default nginx.conf does NOT define it, so add this to
# /etc/nginx/conf.d/agentpod-upgrade.conf (see README-deploy.md):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
