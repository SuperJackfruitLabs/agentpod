version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - npm
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The node-agent runs on other people's machines and self-updates, so its
  # dependencies are the fleet's exposure. Majors are NOT ignored here (unlike
  # npm above): there are only two direct deps, and a major bump of the
  # websocket transport is something we want to see rather than suppress.
  - package-ecosystem: gomod
    directory: /apps/node-agent
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(go)"
    labels:
      - dependencies
      - go

  - package-ecosystem: docker
    directory: /apps/hub
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
