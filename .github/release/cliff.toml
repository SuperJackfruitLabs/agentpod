# git-cliff settings shared by every product's release notes. Commits are grouped by their
# conventional-commit type; anything else lands under "Other".

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs?", group = "<!-- 3 -->Docs" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(chore|ci|build|style)", group = "<!-- 6 -->Chores" },
  { message = ".*", group = "<!-- 7 -->Other" },
]
