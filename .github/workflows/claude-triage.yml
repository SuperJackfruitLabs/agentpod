# Shared kit file (claude-ci). Every product carries this byte-identical at
# .github/workflows/claude-triage.yml; do not edit a copy, change the master and sync it.
#
# When a pull request's CI run fails, Claude reads the failed jobs' log tails and posts or
# updates one comment: likely flaky or likely real, the most likely cause, three lines. It is
# read-only and a no-op until the repository has a CLAUDE_CI_API_KEY secret.
#
# `workflow_run` runs this file from the default branch with the repository's secrets, so it
# never checks out or runs anything from the pull request: the script comes from the default
# branch, the logs come through the API, and pull requests from forks are skipped. Nothing from
# the triggering run (branch names, titles) is put into a shell command.
name: claude-triage

on:
  workflow_run:
    # The main CI workflow's name in each product (CI, ci or checks). Unknown names are ignored.
    workflows: [CI, ci, checks]
    types: [completed]

permissions: {}

concurrency:
  group: claude-triage-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  triage:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Is a key set
        id: gate
        env:
          KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::skipped: no CLAUDE_CI_API_KEY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the triage script from the default branch
        id: kit
        if: steps.gate.outputs.on == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/claude-ci.mjs" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github.raw' \
            "$GITHUB_API_URL/repos/$REPO/contents/.github/claude/claude-ci.mjs?ref=$REF" || true)
          if [ "$code" = 200 ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipped: the default branch has no .github/claude/claude-ci.mjs (HTTP $code)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Triage
        if: steps.kit.outputs.on == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          CLAUDE_CI_API_KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
          CLAUDE_CI_MODEL: ${{ vars.CLAUDE_CI_MODEL }}
          CLAUDE_CI_BASE_URL: ${{ vars.CLAUDE_CI_BASE_URL }}
          CI_HOST: github
          CI_TOKEN: ${{ github.token }}
          CI_REPO: ${{ github.repository }}
          # The run's pull_requests list is often empty; the script finds the PR by its head commit.
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: CI_API_URL="$GITHUB_API_URL" node "$RUNNER_TEMP/claude-ci.mjs" triage
