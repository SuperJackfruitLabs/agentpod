name: CI

on:
  push:
    branches: [main, develop, redesign/fleet-console]
  pull_request:
    branches: [main, develop, redesign/fleet-console]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/contract
        run: bun install

      - name: Run tests
        working-directory: packages/contract
        run: bun test

      # A contract change whose Go fixtures were never regenerated fails here,
      # rather than as a silently-dropped field on the wire. The node-agent job
      # then proves the Go structs still round-trip them.
      - name: Check Go fixtures are current
        working-directory: packages/contract
        run: bun run scripts/emit-go-fixtures.ts --check

  hub:
    name: hub
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentpod
          POSTGRES_PASSWORD: agentpod-dev-password
          POSTGRES_DB: agentpod
        ports:
          # Map to 5434 — that is the default port integration tests fall back to
          # when DATABASE_URL is not set (broker-gateway, stations, runtimes, etc.)
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/hub
        run: bun test
        env:
          NODE_ENV: test
          # Matches the host port mapped above (service container internal 5432 →
          # host 5434) and the integration-test default DATABASE_URL fallback.
          DATABASE_URL: postgres://agentpod:agentpod-dev-password@localhost:5434/agentpod
          API_TOKEN: test-token
          SESSION_SECRET: test-session-secret-32-chars-long
          ENCRYPTION_KEY: test-encryption-key-32-bytes!!!!

  node-agent:
    name: node-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/node-agent/go.mod

      - name: Vet
        working-directory: apps/node-agent
        run: go vet ./...

      - name: Test
        working-directory: apps/node-agent
        run: go test ./... -race

      # Here rather than in a job of its own: it is about the node-agent's
      # runtime layout, and this job is a required check — a new job would not
      # gate. Runs as a user who can write to /, so the /workspace assertions
      # execute rather than skipping the way they do on a macOS dev box.
      - name: Test the Fly image workspace wrapper
        run: sh fly/node-image/test-volume-workspace.sh

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check)
        working-directory: apps/console
        run: pnpm check

      - name: Run tests
        working-directory: apps/console
        run: pnpm test

      - name: Build
        working-directory: apps/console
        run: pnpm build

  # The Cloudflare worker had no CI at all until now: its suite only ever ran in
  # a developer's checkout, which is why the frozen-envVars bug (#253) reached
  # the fleet and silently disabled workspace persistence for every existing
  # sandbox. The tests existed; nothing ran them.
  worker:
    name: worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cloudflare/worker-v2 sits outside the pnpm workspace (apps/*, packages/*)
      # and pins its dependencies with package-lock.json, so this job is npm —
      # copying the pnpm setup used by the hub/console jobs would find no lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare/worker-v2/package-lock.json

      # ci, not install: a package.json edited without regenerating the lockfile
      # should fail here, the same guarantee pnpm --frozen-lockfile gives elsewhere.
      - name: Install dependencies
        working-directory: cloudflare/worker-v2
        run: npm ci

      # Includes the snapshot-wrapper round trip, which shells out to curl and
      # tar against a temp directory — hence no container runtime is needed.
      - name: Run tests
        working-directory: cloudflare/worker-v2
        run: npx vitest run
