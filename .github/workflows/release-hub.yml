name: Release hub and console

# A `v*` tag puts that tag's hub in production on infra, then that tag's console on Pages. It does not rerun the tests: main's
# required checks ran them and staging has been running main. The key can only run
# /usr/local/sbin/prod-deploy (`<product> v<x.y.z>`), which runs deploy/release.sh from the tag:
# its own checkout, a database backup, the switch, /health, the smoke, and a rollback on failure.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency: { group: deploy-hub-production, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: production, url: https://hub.agentpod.dev }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Deploy to production
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          HOST: ${{ vars.PROD_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh root@"$HOST" agentpod "$GITHUB_REF_NAME"
      - name: Smoke the public URL
        run: EXPECT_ISSUER=https://accounts.superjackfruit.com sh deploy/smoke.sh https://hub.agentpod.dev

  # The console is a static build with the production hub baked in; it ships with the hub, on
  # the same tag, after the hub's deploy, so a console never reaches people ahead of the hub it
  # calls. main still builds and tests it (ci.yml `console`) and deploys it to staging.
  deploy-console:
    needs: [deploy]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-console
      cancel-in-progress: false
    environment:
      name: docs
      url: https://console.agentpod.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # vibekit needs Node 22 or newer, as in the console job.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/console
        env:
          PUBLIC_HUB_URL: https://hub.agentpod.dev
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: it is in every dashboard URL. Naming the account stops wrangler
          # looking it up through /memberships, which a Pages-scoped token may not read
          # (code 9106). Whether that lookup happens depends on the wrangler version npx
          # resolves — deploy-console, after a full workspace install, got 4.86.0 instead
          # of a fresh 4.133.0 and failed on exactly this on 2026-09-17.
          CLOUDFLARE_ACCOUNT_ID: 88acd85618f099112eadc9374996b9f7
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-cwd"
          cd "$RUNNER_TEMP/wrangler-cwd"
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/apps/console/build" \
            --project-name=agentpod-console --branch=main \
            --commit-hash="$GITHUB_SHA"
