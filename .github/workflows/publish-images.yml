# Build and publish the substrate node images to GHCR.
#
# Manual only. These images are what Fly and Modal pull to run a station, and
# both substrates are billed — so publishing is an act, not a side effect of
# pushing code. `workflow_dispatch` keeps the decision with a human.
#
# This replaces hand-building on a workstation, which had two real problems:
# Apple Silicon needs emulation for the required linux/amd64 (slow, and the base
# image has to be rebuilt amd64 first, clobbering the local arm64 tag the Docker
# provisioner uses), and a hand-pushed image records nothing about which commit
# produced it.
#
# NOTE: the published package MUST end up public — Modal calls
# `images.fromRegistry(tag)` with no Secret and cannot authenticate to a private
# registry, and Fly pulls anonymously. Measured on the first Fly run: the
# package came out `public` with no UI step needed. Re-check with
# `gh api '/user/packages?package_type=container'` after adding a new image
# rather than assuming, since this is an account-level default, not a guarantee
# of this workflow.
name: publish-images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build
        required: true
        default: all
        type: choice
        options: [all, fly, fly-pi, modal, modal-opencode, modal-pi]
      tag:
        description: Tag to publish (e.g. v0.1.24)
        required: true
        type: string
      # Fly images only — the Modal ones compile the node-agent from the checked
      # out source and have no version to pin. Blank means "the latest release",
      # resolved at build time, which is what makes a published Fly image carry
      # the newest verified binary without anyone remembering to edit a
      # Dockerfile (issue #290). Set it to publish a specific older release on
      # purpose.
      node_agent_version:
        description: node-agent release to bake into the Fly images (blank = latest release)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Independent images: one failing must not cancel the others, or a Modal
      # build problem hides a good Fly image.
      fail-fast: false
      matrix:
        include:
          # Each row carries four things that are NOT cosmetic:
          #
          #   context      — Fly's Dockerfiles COPY repo-root-relative paths
          #                  (apps/node-agent/..., fly/node-image/...), while the
          #                  Modal ones COPY `deploy/...` relative to
          #                  apps/node-agent. Building either from the wrong
          #                  context fails at COPY, not at push (issue #276).
          #   local_base   — which un-published image this one is FROM, and must
          #                  therefore be built on the runner first. `none` is
          #                  the Fly images, which start from a public base and
          #                  bake in a RELEASED node-agent binary instead of
          #                  compiling one.
          #   harness      — which harness binary the verify step must find ON
          #                  PATH. `none` is a bare node image.
          #   modal        — whether the Modal-specific constraints (python3,
          #                  pip, empty ENTRYPOINT) are checked.
          #   agent_pin    — whether this image takes AGENTPOD_VERSION, i.e.
          #                  bakes in a RELEASED binary. "yes" for the Fly
          #                  images only; the Modal ones `go build` the agent
          #                  from this checkout, so passing them a version would
          #                  be a no-op build-arg and checking a pin they do not
          #                  have would fail a Modal-only publish on a Fly-only
          #                  concern.
          - name: fly
            dockerfile: fly/node-image/Dockerfile
            context: .
            image: agentpod-node-opencode-fly
            local_base: none
            harness: opencode
            modal: "no"
            agent_pin: "yes"
          - name: fly-pi
            dockerfile: fly/node-image/Dockerfile.pi
            context: .
            image: agentpod-node-pi-fly
            local_base: none
            harness: pi
            modal: "no"
            agent_pin: "yes"
          - name: modal
            dockerfile: apps/node-agent/deploy/Dockerfile.modal
            context: apps/node-agent
            image: agentpod-node-modal
            local_base: base
            harness: none
            modal: "yes"
            agent_pin: "no"
          - name: modal-opencode
            dockerfile: apps/node-agent/deploy/Dockerfile.modal.opencode
            context: apps/node-agent
            image: agentpod-node-modal-opencode
            local_base: opencode
            harness: opencode
            modal: "yes"
            agent_pin: "no"
          - name: modal-pi
            dockerfile: apps/node-agent/deploy/Dockerfile.modal.pi
            context: apps/node-agent
            image: agentpod-node-modal-pi
            local_base: pi
            harness: pi
            modal: "yes"
            agent_pin: "no"
    steps:
      - name: Skip images not selected
        id: gate
        run: |
          if [ "${{ inputs.image }}" = "all" ] || [ "${{ inputs.image }}" = "${{ matrix.name }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Which node-agent RELEASE the Fly images bake in, resolved at build time
      # instead of read from the Dockerfile's ARG default. Before this, the
      # default WAS the published version: it said v0.1.22 for two releases, so
      # every Fly station ran an agent missing fixes the rest of the fleet had,
      # and republishing could not change that (issue #290). Resolving here
      # means a Fly publish always ships the newest release, and the pin in the
      # Dockerfile is only what a local `docker build` falls back to.
      #
      # Fly rows only. The Modal images compile the agent from this checkout, so
      # this step, its build-arg and its staleness check are all skipped for
      # them — a modal-only publish never touches any of this.
      - name: Resolve the node-agent release for the Fly images
        id: agent
        if: steps.gate.outputs.run == 'true' && matrix.agent_pin == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.node_agent_version }}
        run: |
          set -eu
          if [ -n "${REQUESTED:-}" ]; then
            version="$REQUESTED"
          else
            version="$(sh fly/node-image/check-version-pin.sh --print-latest)"
          fi
          case "$version" in
            v[0-9]*.[0-9]*) ;;
            *) echo "not a vMAJOR.MINOR.PATCH node-agent version: '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "baking node-agent $version into ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"

          # The ARG defaults must not be BEHIND what is being published, or the
          # repo goes on describing an image that no longer exists and the next
          # local build silently produces a worse one. Requesting an older
          # version on purpose still passes — the defaults are ahead of it, not
          # behind.
          sh fly/node-image/check-version-pin.sh --latest "$version"

      # agentpod-node:base is not published anywhere, so every image that is
      # FROM it (directly, or through a harness layer) has to build it here. The
      # runner is amd64, so this is a native build — no emulation, and no risk
      # of clobbering a developer's local arm64 base tag.
      - name: Build the base image
        if: steps.gate.outputs.run == 'true' && matrix.local_base != 'none'
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/node-agent/deploy/Dockerfile.base \
            -t agentpod-node:base \
            apps/node-agent

      # The Modal harness images are FROM the harness image rather than beside
      # it, so that the opencode/pi version pins have ONE definition
      # (Dockerfile.opencode, Dockerfile.pi) instead of a copy per substrate
      # that drifts on the next bump. That makes the harness layer a build
      # dependency, and it is equally unpublished.
      - name: Build the harness layer this image extends
        if: steps.gate.outputs.run == 'true' && matrix.local_base != 'none' && matrix.local_base != 'base'
        run: |
          docker build \
            --platform linux/amd64 \
            -f "apps/node-agent/deploy/Dockerfile.${{ matrix.local_base }}" \
            -t "agentpod-node-${{ matrix.local_base }}:local" \
            apps/node-agent

      - name: Build and push
        if: steps.gate.outputs.run == 'true'
        env:
          # Empty for the Modal images, whose Dockerfiles have no such ARG:
          # passing one would be a silently ignored build-arg (or a warning
          # nobody reads), so the argument is only added when there is one.
          AGENT_VERSION: ${{ steps.agent.outputs.version }}
        run: |
          # GHCR refs must be lowercase; `github.repository_owner` is not — it is the
          # account name verbatim, and this repository moved to an owner with capitals
          # in it on 2026-08-14, which failed every build with "repository name must
          # be lowercase". Lowercasing here rather than hardcoding keeps a fork or a
          # future move working without another edit.
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner}/${{ matrix.image }}"
          args=(
            --platform linux/amd64
            -f "${{ matrix.dockerfile }}"
            -t "${ref}:${{ inputs.tag }}"
            -t "${ref}:latest"
            --label "org.opencontainers.image.revision=${{ github.sha }}"
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          )
          if [ -n "$AGENT_VERSION" ]; then
            args+=(--build-arg "AGENTPOD_VERSION=$AGENT_VERSION")
          fi
          docker build "${args[@]}" "${{ matrix.context }}"
          docker push "${ref}:${{ inputs.tag }}"
          docker push "${ref}:latest"
          echo "published ${ref}:${{ inputs.tag }} from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # A pushed image nobody verified is how a broken station reaches a
      # substrate. Every claim an image makes is checked against the image that
      # was actually pushed, not against the Dockerfile that was supposed to
      # produce it.
      - name: Verify what was published
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eux
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner}/${{ matrix.image }}:${{ inputs.tag }}"

          # Every image: the node-agent binary is there and runs.
          agent_version_out="$(docker run --rm --entrypoint /agentpod-node "$ref" version)"

          if [ "${{ matrix.agent_pin }}" = "yes" ]; then
            # And for the Fly images, that it is the release this run resolved.
            # They bake in a downloaded binary, so the version is a fact about
            # the pushed image rather than about the checkout — which makes it
            # the one check that catches a build-arg that never reached the
            # Dockerfile, the failure mode that let v0.1.22 keep shipping.
            case "$agent_version_out" in
              "agentpod-node ${{ steps.agent.outputs.version }} "*) ;;
              *) echo "expected node-agent ${{ steps.agent.outputs.version }}, image reports: $agent_version_out"; exit 1 ;;
            esac
          fi

          if [ "${{ matrix.modal }}" = "yes" ]; then
            # Modal's runtime is Python and it takes over the container command;
            # an image missing either is accepted at push and fails at first boot.
            docker run --rm --entrypoint python3 "$ref" --version
            docker run --rm --entrypoint sh "$ref" -c 'python3 -m pip --version'

            # An empty ENTRYPOINT reads back as `null` when nothing ever set one
            # and as `[]` when a harness layer's ENTRYPOINT was cleared by this
            # image — both are empty, and only a non-empty one is the failure
            # (Modal requires any ENTRYPOINT to end in `exec "$@"`, and ours
            # never can). Matching on the two shapes rather than stripping
            # characters out of the JSON, which quietly passed `[]` as truthy.
            entrypoint="$(docker inspect -f '{{json .Config.Entrypoint}}' "$ref")"
            case "$entrypoint" in
              null|"[]") ;;
              *) echo "Modal image must have an empty ENTRYPOINT, got: $entrypoint"; exit 1 ;;
            esac
          fi

          # The harness binary must be findable by a NON-LOGIN, NON-INTERACTIVE
          # process — which is what the node-agent is, and what it spawns ACP
          # adapters as. `env -i` throws away the image's own ENV and hands the
          # command systemd's default PATH; an install that only works from a
          # developer's shell (a moved npm prefix, a profile script, a
          # user-local bin) fails here instead of failing live. This is the
          # check that would have caught the 2026-08-12 pi-acp incident, where
          # the adapter was spawned with a minimal PATH and could not see `pi`.
          service_path='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          case "${{ matrix.harness }}" in
            opencode)
              docker run --rm --entrypoint env "$ref" -i "PATH=$service_path" HOME=/root \
                sh -c 'command -v opencode && opencode --version'
              ;;
            pi)
              docker run --rm --entrypoint env "$ref" -i "PATH=$service_path" HOME=/root \
                sh -c 'command -v pi && command -v pi-acp && pi --version'
              ;;
            none)
              # A bare node image must NOT carry a harness: the hub resolves a
              # separate image per harness, and one that quietly bundled a
              # harness would make a "Generic" runtime detect stations nobody
              # asked for.
              docker run --rm --entrypoint sh "$ref" -c '
                if command -v opencode >/dev/null 2>&1 || command -v pi >/dev/null 2>&1; then
                  echo "harness-less image unexpectedly contains a harness"; exit 1
                fi'
              ;;
          esac
