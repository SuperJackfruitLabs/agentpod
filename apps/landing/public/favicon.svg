<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AgentPod">
  <!-- Three nodes dialling in to one hub.
       Drawn for 16px first: thick strokes and solid discs, because the previous
       mark's 1.6px lines disappeared at tab size. The arrangement carries the
       meaning even when the connectors stop resolving. -->
  <rect width="32" height="32" rx="7.5" fill="#101c2b"/>
  <g stroke="#5fb3d4" stroke-width="2.6" stroke-linecap="round">
    <path d="M16 16 L7.5 8.5"/>
    <path d="M16 16 L24.5 10"/>
    <path d="M16 16 L10.5 24.5"/>
  </g>
  <g fill="#5fb3d4">
    <circle cx="7.5" cy="8.5" r="3.1"/>
    <circle cx="24.5" cy="10" r="3.1"/>
    <circle cx="10.5" cy="24.5" r="3.1"/>
  </g>
  <circle cx="16" cy="16" r="5.4" fill="#eef4fa"/>
</svg>
